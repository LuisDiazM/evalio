[tool.coverage.run]
branch = true
source = [ "grader_analyzer" ]

[tool.coverage.report]
exclude_lines = [ "if TYPE_CHECKING:" ]
show_missing = true

[tool.pytest.ini_options]
addopts = """
 --cov
 --cov-report html:'../../coverage/backend/grader_analyzer/html'
 --cov-report xml:'../../coverage/backend/grader_analyzer/coverage.xml'
 --html='../../reports/backend/grader_analyzer/unittests/html/index.html'
 --junitxml='../../reports/backend/grader_analyzer/unittests/junit.xml'
"""

[tool.hatch.build.targets.wheel]
packages = [ "grader_analyzer" ]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
exclude = [ ".ruff_cache", ".svn", ".tox", ".venv", "dist" ]
line-length = 88
indent-width = 4

  [tool.ruff.lint]
  select = [ "E", "F", "UP", "B", "SIM", "I" ]
  ignore = [ ]
  fixable = [ "ALL" ]
  unfixable = [ ]

[project]
name = "grader_analyzer"
version = "1.0.0"
description = "Automatically generated by Nx."
requires-python = ">=3.9,<4"
readme = "README.md"
dependencies = [
  "minio>=7.2.20",
  "nats-py==2.10.0",
  "opencv-python==4.11.0.86",
  "pillow==11.2.1",
  "pydantic==2.11.4",
  "pymongo==4.15.5",
  "python-dotenv>=1.2.1",
  "pytz>=2025.2",
  "google-cloud-storage==2.14.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.13.0",
  "pytest>=7.0"
]

[build-system]
requires = [ "hatchling" ]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.14.8",
]
