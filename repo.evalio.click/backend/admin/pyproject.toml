[tool.coverage.run]
branch = true
source = [ "admin" ]

[tool.coverage.report]
exclude_lines = ['if TYPE_CHECKING:']
show_missing = true

[tool.pytest.ini_options]
addopts = """
 --cov
 --cov-report html:'../../coverage/backend/admin/html'
 --cov-report xml:'../../coverage/backend/admin/coverage.xml'
 --html='../../reports/backend/admin/unittests/html/index.html'
 --junitxml='../../reports/backend/admin/unittests/junit.xml'
"""

[project]
name = "admin"
version = "1.0.0"
description = "Automatically generated by Nx."
requires-python = ">=3.9,<4"
readme = 'README.md'
dependencies = [
    "fastapi==0.115.12",
    "google-cloud-storage==2.14.0",
    "pandas==2.2.3",
    "pillow==11.1.0",
    "pydantic==2.11.3",
    "qrcode==8.1",
    "reportlab==4.3.1",
    "uvicorn==0.34.2",
]

[tool.hatch.build.targets.wheel]
packages = ["admin"]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
  "autopep8>=2.3.1",
  "ruff>=0.8.2",
  "pytest>=8.3.4",
  "pytest-sugar>=1.0.0",
  "pytest-cov>=6.0.0",
  "pytest-html>=4.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
exclude = [
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  "dist",
]

line-length = 88
indent-width = 4

[tool.ruff.lint]
select = [
  # pycodestyle
  "E",
  # Pyflakes
  "F",
  # pyupgrade
  "UP",
  # flake8-bugbear
  "B",
  # flake8-simplify
  "SIM",
  # isort
  "I",
]
ignore = []

fixable = ["ALL"]
unfixable = []
