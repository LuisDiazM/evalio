server {
    listen 5000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve SPA — fallback to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Caching for static assets
    location ~* \.(?:css|js|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # Security headers (recommended)
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";

    gzip on;
    gzip_types text/plain application/javascript application/x-javascript text/javascript application/json text/css application/xml text/xml image/svg+xml;
}
